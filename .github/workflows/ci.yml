# Runs both surfaces' fast, deterministic quality gates on every push/PR to dev or
# main, so a regression is caught in CI instead of on prod (web) or at a venue
# (desktop). Deliberately does NOT run `next build` here — Vercel already builds on
# the main deploy, and a CI build would need the Supabase env — every gate below is
# secret-free and quick.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The only gate whose subject is the BYTES rather than the syntax. Round 10
      # nearly shipped mojibake into a live confirm dialog after a source file was
      # round-tripped through Windows PowerShell 5.1 — tsc, lint and 394 tests all
      # stayed green, because nothing else here reads Thai.
      - name: Encoding
        run: node scripts/check-encoding.mjs

  # The desktop (Electron) renderer reuses components/ + lib/, but `desktop` is
  # EXCLUDED from the root tsconfig and desktop-build.yml only packages installers
  # on demand — so without this job a desktop-only break reaches the show laptop
  # unseen. Secret-free too: desktop/vite.config.ts bakes in the public defaults.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # Root deps too: the renderer imports the shared components/lib from the repo
      # root via the "@" alias, so their packages must resolve from /node_modules.
      - name: Install root deps
        run: npm ci

      - name: Install desktop deps
        run: npm ci
        working-directory: desktop

      - name: Typecheck desktop
        run: npm run typecheck
        working-directory: desktop

      # `vite build` only — packaging installers stays in desktop-build.yml. The
      # bundle is what catches an import the desktop can't resolve (a Next-only
      # module, a missing alias/shim), which tsc alone doesn't see.
      - name: Build desktop renderer
        run: npm run build
        working-directory: desktop

  # Boots the REAL Electron app — offline, with a session — on every push, not just
  # on a release tag.
  #
  # desktop-build.yml runs the same three scenarios against the packaged .exe, but
  # only when a `v*` tag is pushed. That is the right gate for PUBLISHING and the
  # wrong one for catching a regression: by the time a tag exists the offending
  # commit is days old. This job runs the identical scenarios against electron +
  # the vite build, which is the same main.cjs, the same preload, the same file://
  # origin and the same disk profile — everything the offline path depends on. Only
  # app.isPackaged differs, and nothing asserted here reads it.
  #
  # windows-latest, not ubuntu: Electron needs a display server on Linux (xvfb), and
  # Windows is also the platform every one of these installs actually runs on.
  desktop-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install desktop deps
        run: npm ci
        working-directory: desktop

      - name: Build desktop renderer
        run: npm run build
        working-directory: desktop

      # ⚠️ `npm ci` DID NOT FETCH THE ELECTRON BINARY HERE, and it did not say so.
      # Two consecutive runs installed 481 packages in ~12 seconds — far too fast to
      # have downloaded a ~100 MB runtime — and the smoke then failed with "no
      # executable". electron ships this exact script as its own postinstall, so
      # running it by hand is not a workaround for the wrong problem: it is the same
      # code path, made unconditional. It is a no-op when the binary is already
      # there, and unlike the postinstall it cannot be skipped silently.
      - name: Make sure electron's binary is actually installed
        run: node node_modules/electron/install.js
        working-directory: desktop

      # cold -> the login screen · airplane (expired session, DNS dead,
      # navigator.onLine false) -> the signed-in dashboard rendered from cache ·
      # Quick Show -> opens with no account and no network. Plus TWO cross-checks:
      # the job fails if the cold and airplane boots land on the same screen (what
      # every silent seeding failure looks like), and it fails if the control boot
      # could not reach the Supabase host either — because "the network was cut" is
      # only evidence when the same request resolves with nothing blocking it.
      #
      # ⚠️ TIMEOUT NESTING, outermost last: the app's own watchdog (main.cjs) fires at
      # --timeout minus 45s and is the ONLY one that reports a stage, run-smoke's
      # --timeout (135s default, per scenario) fires next, and this step is the
      # backstop. 3 scenarios x 135s = ~7 min, so 15 keeps this strictly outermost
      # even if every scenario times out; it is here to kill a wedged runner, not to
      # pre-empt an answer the app was about to give.
      - name: Boot the app offline with a session
        shell: bash
        timeout-minutes: 15
        run: node desktop/scripts/run-smoke.mjs --app desktop
